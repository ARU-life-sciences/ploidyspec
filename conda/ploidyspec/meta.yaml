{% set name = "ploidyspec" %}
{% set version = "0.1.1" %}
{% set sha256 = "0e9cad832bdf37971fe1e28233a70a261a27bbf1fcc62e64be876a8c0ad2ff89" %}
{% set python_min = "3.9" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ARU-life-sciences/ploidyspec/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  entry_points:
    - ploidyspec = ploidyspec.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
  run:
    - python >={{ python_min }}
    - numpy
    - matplotlib-base
    - samtools
    - fastk >=1.2

test:
  requires:
    - python {{ python_min }}
  imports:
    - ploidyspec
  commands:
    - ploidyspec --version
    - ploidyspec --help
    - ploidyspec check

about:
  home: https://github.com/ARU-life-sciences/ploidyspec
  dev_url: https://github.com/ARU-life-sciences/ploidyspec
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Reference-free k-mer profiling of ploidy, polyploid origin and rediploidization from haplotype-resolved assemblies"
  description: |
    ploidyspec reads chromosome-scale, haplotype-resolved assemblies and reports
    copies per chromosome number, homeolog pairs and subgenomes, auto-like versus
    allo-like inheritance, TE markers between subgenomes, and residual tetrasomy
    and homeologous exchange along the chromosomes. No reference genome or
    alignment is needed.

extra:
  recipe-maintainers:
    - Euphrasiologist
