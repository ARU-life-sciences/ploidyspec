[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ploidyspec"
dynamic = ["version"]
description = "Reference-free k-mer profiling of polyploid origin and rediploidization from haplotype-resolved assemblies"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Max Brown" }]
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[project.scripts]
ploidyspec = "ploidyspec.cli:main"

[tool.setuptools]
packages = ["ploidyspec"]

[tool.setuptools.dynamic]
version = { attr = "ploidyspec.__version__" }
